<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | EventBrix</title>
  <link rel="stylesheet" href="../styles.css" />
</head>

<body>

  <h2 class="dash-title">Admin Dashboard</h2>

  <h3>Pending Vendors</h3>
  <div id="pendingVendors" class="admin-vendor-list"></div>

  <!-- Firebase FIRST -->
  <script type="module" src="../scripts/firebase.js"></script>

  <!-- 🔥 SECURITY CHECK SCRIPT -->
  <script type="module">
    import { auth } from "../scripts/firebase.js";

    auth.onAuthStateChanged((user) => {
      if (!user) {
        // Not logged in → go to admin login
        window.location.href = "/admin/admin-login.html";
      } else {
        // Check allowed admin email
        if (user.email !== "admin@eventbrix.com") {
          auth.signOut();
          alert("Unauthorized Access!");
          window.location.href = "/admin/admin-login.html";
        }
      }
    });
  </script>

  <!-- ADMIN JS FILE -->
  <script type="module" src="../scripts/admin-dashboard.js"></script>

</body>
</html>
