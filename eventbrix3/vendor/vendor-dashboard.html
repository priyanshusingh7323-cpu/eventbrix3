<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Dashboard | EventBrix</title>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<!-- TOP ACTION BAR -->
<div style="padding:15px; display:flex; gap:12px;">
  <button id="homeBtn" class="btn-primary">🏠 Home</button>
  <button id="logoutTopBtn" class="btn-secondary">🚪 Logout</button>
</div>

<h1 class="title">Vendor Dashboard</h1>

<!-- MAIN DATA -->
<div class="section" id="vendorData">

  <h2 id="vendorName"></h2>

  <p><strong>City:</strong> <span id="vendorCity"></span></p>
  <p><strong>Vendor ID:</strong> <span id="vendorID"></span></p>
  <p><strong>Status:</strong> <span id="vendorStatus"></span></p>

  <hr style="margin:15px 0; border-color:#333;">

  <button id="newListingBtn" class="btn-primary">+ Create New Listing</button>

  <h2 style="margin-top:20px;">Your Listings</h2>
  <div id="vendorListings"></div>

  <h2 style="margin-top:25px;">Approved Leads</h2>
  <div id="vendorLeads"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="vendor-dashboard.html">🏠</a>
  <a href="vendor-register.html">📝</a>
  <a href="chat.html">💬</a>
  <a id="logoutBtn">🚪</a>
</div>

<script type="module">
import { auth } from "/scripts/firebase.js";
import { signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* HOME BUTTON */
document.getElementById("homeBtn").onclick = () => {
  location.href = "/index.html";
};

/* LOGOUT (TOP BAR) */
document.getElementById("logoutTopBtn").onclick = async () => {
  await signOut(auth);
  localStorage.clear();
  sessionStorage.clear();
  location.href = "/vendor/vendor-login.html";
};

/* LOGOUT (BOTTOM NAV) */
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  localStorage.clear();
  sessionStorage.clear();
  location.href = "/vendor/vendor-login.html";
};
</script>

<script type="module" src="../scripts/vendor-dashboard.js"></script>
<script src="../scripts/smooth-ui.js"></script>


</body>
</html>
