<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments & Refunds | EventBrix</title>

<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/styles-dashboard.css">

<style>
.page-header {
  background:#111;
  padding:15px;
  color:gold;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  border-bottom:1px solid rgba(255,200,60,0.2);
}

.payment-card {
  background:#161616;
  border:1px solid rgba(255,200,60,0.3);
  padding:15px;
  margin:12px;
  border-radius:12px;
  color:white;
}

.status-paid {
  color:#7dff7d;
  font-weight:bold;
}

.status-refunded {
  color:#ff7d7d;
  font-weight:bold;
}

.status-pending {
  color:#ffbf5e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="page-header">Payments & Refunds</div>

<div id="paymentHistory"></div>

<script type="module">
import { db, auth } from "/scripts/firebase.js";
import {
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

auth.onAuthStateChanged(async (user)=>{
  if(!user) return (location.href="/customer/customer-login.html");
  loadPayments(user.uid);
});

async function loadPayments(uid){
  const box = document.getElementById("paymentHistory");
  box.innerHTML = "Loading...";

  const snap = await getDocs(
    query(collection(db,"bookings"), where("customerId","==",uid))
  );

  box.innerHTML = "";

  snap.forEach(b=>{
    const d = b.data();

    if (d.paymentStatus !== "unpaid" && d.paymentStatus !== "pay_later") {
      box.innerHTML += `
        <div class="payment-card">
          <h3>${d.vendorName}</h3>
          <p>Amount: ₹${d.amount}</p>
          <p>Date: ${d.eventDate}</p>
          <p>Status:
            <span class="${
              d.paymentStatus === "paid" ? "status-paid" :
              d.paymentStatus === "refunded" ? "status-refunded" :
              "status-pending"
            }">
              ${d.paymentStatus}
            </span>
          </p>
        </div>
      `;
    }
  });
}
</script>

</body>
</html>
