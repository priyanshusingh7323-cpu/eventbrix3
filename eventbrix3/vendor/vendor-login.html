<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Login | EventBrix</title>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<h1 class="title">Vendor Login</h1>

<div class="form-box">
  
  <!-- EMAIL LOGIN -->
  <form id="vendorLoginForm">
    <input type="email" id="email" placeholder="Email *" required>
    <input type="password" id="password" placeholder="Password *" required>
    <button type="submit">Login</button>
  </form>

  <!-- OR -->
  <p style="text-align:center;margin-top:15px;">OR</p>

  <!-- PHONE LOGIN -->
  <input type="tel" id="phoneLogin" placeholder="Phone Number *" style="margin-bottom:10px;">
  <button type="button" id="sendOtpBtn" style="background:#d4a017;color:white;margin-bottom:10px;">
    Send OTP
  </button>

  <input type="text" id="otpInput" placeholder="Enter OTP" style="display:none;margin-bottom:10px;">
  <button type="button" id="verifyOtpBtn" style="display:none;background:#28a745;color:white;">
    Verify OTP
  </button>

  <p style="text-align:center;margin-top:10px;">
    New here? <a href="vendor-signup.html" style="color:#d4a017;">Signup</a>
  </p>
</div>

<script type="module" src="../scripts/vendor-login.js"></script>
<script src="../scripts/smooth-ui.js"></script>

</body>
</html>
