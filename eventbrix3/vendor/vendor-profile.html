<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Profile | EventBrix</title>
<link rel="stylesheet" href="../styles.css">

<style>

/* HEADER IMAGE */
.profile-header {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-bottom: 2px solid #222;
}

/* MAIN INFO BOX */
.vendor-info {
  padding: 18px;
  background: #0e0e0e;
}

/* NAME + BOOK BUTTON */
.vendor-title-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.vendor-title-box h2 {
  font-size: 20px;
  font-weight: 600;
  color: #fff;
}

/* INFO TEXT */
.info-line {
  margin: 8px 0;
  font-size: 15px;
  color: #cccccc;
}

/* SECTIONS */
.section-title {
  margin-top: 25px;
  font-size: 18px;
  font-weight: 600;
  color: #ffd24a;
}

/* LISTINGS */
.vendor-listing-card {
  width: 100%;
  background: #111;
  border: 1px solid #333;
  border-radius: 10px;
  margin: 12px 0;
  overflow: hidden;
}

.vendor-listing-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.vendor-listing-card div {
  padding: 10px;
  color: #fff;
}

/* INPUT BASIC STYLE */
.inputBox {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid #444;
  background: #1a1a1a;
  color: white;
}

</style>
</head>

<body>

<h1 class="title">Vendor Profile</h1>

<img id="headerImg" class="profile-header" src="/images/default.jpg">

<div class="vendor-info">

  <div class="vendor-title-box">
      <h2 id="vendorName"></h2>
      <button id="bookNowBtn" class="btn-primary">Book Now</button>
  </div>

  <p class="info-line"><strong>Category:</strong> <span id="vendorCategory"></span></p>
  <p class="info-line"><strong>City:</strong> <span id="vendorCity"></span></p>
  <p class="info-line"><strong>Starting Price:</strong> <span id="vendorPrice"></span></p>

  <div class="action-buttons">
    <a id="chatBtn">Chat</a>
    <button id="saveVendorBtn">❤️ Save</button>
  </div>

  <h3 class="section-title">About</h3>
  <p id="vendorAbout" style="color:#ccc;"></p>

  <h3 class="section-title">Listings</h3>
  <div id="vendorListings"></div>
</div>



<!-- ----------------------------------------- -->
<!-- BOOKING POPUP + OVERLAY + THANK YOU BOX -->
<!-- ----------------------------------------- -->

<!-- OVERLAY -->
<div id="popupOverlay" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  z-index:998;">
</div>

<!-- POPUP -->
<div id="bookingPopup" style="
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:90%;
  max-width:400px;
  background:#111;
  padding:20px;
  border-radius:12px;
  z-index:999;
  color:white;
">

  <h2 style="margin-bottom:10px;">Book Vendor</h2>

  <input id="cName" placeholder="Your Name" class="inputBox">
  <input id="cPhone" placeholder="Phone" class="inputBox">
  <input id="cDate" type="date" class="inputBox">
  <input id="cCity" placeholder="Event City" class="inputBox">
  <input id="cVenue" placeholder="Venue Location" class="inputBox">
  <input id="cGuests" placeholder="Guest Count" class="inputBox">
  <textarea id="cMsg" placeholder="Message" class="inputBox"></textarea>

  <button id="submitBookingBtn" class="btn-primary" style="width:100%; margin-top:10px;">Submit</button>
  <button id="closePopupBtn" class="btn-secondary" style="width:100%; margin-top:8px;">Close</button>

</div>

<!-- THANK YOU -->
<div id="thankYouBox" style="
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#14c414;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  font-size:14px;
  z-index:1000;">
  Booking Sent!
</div>


<!-- JS -->
<script type="module" src="../scripts/vendor-profile.js"></script>

</body>
</html>
