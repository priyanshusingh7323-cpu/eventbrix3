<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Profile | EventBrix</title>
<link rel="stylesheet" href="../styles.css">

<style>

/* HEADER IMAGE */
.profile-header {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-bottom: 2px solid #222;
}

/* MAIN INFO BOX */
.vendor-info {
  padding: 18px;
  background: #0e0e0e;
}

/* NAME + BOOK BUTTON */
.vendor-title-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.vendor-title-box h2 {
  font-size: 20px;
  font-weight: 600;
  color: #fff;
}

/* INFO TEXT */
.info-line {
  margin: 8px 0;
  font-size: 15px;
  color: #cccccc;
}

/* SECTIONS */
.section-title {
  margin-top: 25px;
  font-size: 18px;
  font-weight: 600;
  color: #ffd24a;
}

/* LISTINGS */
.vendor-listing-card {
  width: 100%;
  background: #111;
  border: 1px solid #333;
  border-radius: 10px;
  margin: 12px 0;
  overflow: hidden;
}

.vendor-listing-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.vendor-listing-card div {
  padding: 10px;
  color: #fff;
}

</style>

</head>

<body>

<h1 class="title">Vendor Profile</h1>

<img id="headerImg" class="profile-header" src="/images/default.jpg">

<div class="vendor-info">

  <div class="vendor-title-box">
      <h2 id="vendorName"></h2>
      <button id="bookNowBtn" class="btn-primary">Book Now</button>
  </div>

  <p class="info-line"><strong>Category:</strong> <span id="vendorCategory"></span></p>
  <p class="info-line"><strong>City:</strong> <span id="vendorCity"></span></p>
  <p class="info-line"><strong>Starting Price:</strong> <span id="vendorPrice"></span></p>

  <div class="action-buttons">
    <a id="chatBtn">Chat</a>
    <button id="saveVendorBtn">❤️ Save</button>
  </div>

  <h3 class="section-title">About</h3>
  <p id="vendorAbout" style="color:#ccc;"></p>

  <h3 class="section-title">Listings</h3>
  <div id="vendorListings"></div>
</div>

<!-- POPUP + JS -->
<script type="module" src="../scripts/vendor-profile.js"></script>
</body>
</html>
