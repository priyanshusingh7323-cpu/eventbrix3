<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Signup | EventBrix</title>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<h1 class="title">Vendor Signup</h1>

<div class="form-box">
  <form id="vendorSignupForm">

    <input type="text" id="name" name="name" placeholder="Full Name *" required>

    <!-- PHONE NUMBER -->
    <input type="tel" id="phone" placeholder="Phone Number *" required>

    <!-- SEND OTP -->
    <button type="button" id="sendOtpBtn" 
      style="background:#d4a017;color:white;margin-top:8px;">
      Send OTP
    </button>

    <!-- OTP INPUT -->
    <input type="text" id="otpCode" placeholder="Enter OTP" style="display:none;">

    <!-- VERIFY OTP -->
    <button type="button" id="verifyOtpBtn" 
      style="display:none;background:#28a745;color:white;">
      Verify OTP
    </button>

    <!-- EMAIL + PASSWORD (Only after OTP verified) -->
    <input type="email" id="email" name="email" placeholder="Email *" required style="display:none;">
    <input type="password" id="password" name="password" placeholder="Create Password *" required style="display:none;">

    <button type="submit" id="createAccountBtn" style="display:none;">
      Create Vendor Account
    </button>

  </form>

  <p style="text-align:center;margin-top:10px;">
    Already registered? 
    <a href="vendor-login.html" style="color:#d4a017;">Login</a>
  </p>
</div>

<script type="module" src="../scripts/vendor-signup.js"></script>
<script src="../scripts/smooth-ui.js"></script>

</body>
</html>
