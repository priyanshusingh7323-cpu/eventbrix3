<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Signup | EventBrix</title>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<h1 class="title">Vendor Signup</h1>

<div class="form-box">
  <form id="vendorSignupForm">

    <input type="text" id="name" placeholder="Full Name *" required>

    <input type="email" id="email" placeholder="Email *" required>
    <input type="password" id="password" placeholder="Create Password *" required>

    <button type="submit">Create Vendor Account</button>
  </form>

  <p style="text-align:center;margin-top:10px;">
    Already registered? 
    <a href="vendor-login.html" style="color:#d4a017;">Login</a>
  </p>
</div>

<script type="module" src="../scripts/vendor-signup.js"></script>
</body>
</html>
