<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Signup | EventBrix</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body>

  <div class="form-box">
    <h2>Create Vendor Account</h2>

    <form id="vendorSignupForm">

      <input type="text" name="name" placeholder="Full Name *" required />

      <input type="email" name="email" placeholder="Email *" required autocomplete="username" />

      <input type="text" name="phone" placeholder="Phone Number *" required />

      <input type="password" name="password" placeholder="Create Password *" required autocomplete="new-password" />

      <button type="submit">Sign Up</button>
    </form>

    <button id="googleSignupBtn" style="margin-top:10px;">Sign up with Google</button>

    <p>Already have an account? <a href="vendor-login.html">Login here</a></p>
  </div>

  <!-- IMPORTANT: Correct path (vendor folder se ek level upar scripts hai) -->
  <script type="module" src="../scripts/vendor-signup.js"></script>
</body>
</html>
