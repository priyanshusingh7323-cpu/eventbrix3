<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Registration</title>

<link rel="stylesheet" href="../styles.css">

<!-- GOOGLE MAPS AUTOCOMPLETE -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>

<style>
.location-btn {
  background:#d4a017;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  margin:6px 0;
  font-weight:600;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1 class="title">Business Details</h1>

<div class="form-box">

  <form id="vendorRegisterForm">

    <!-- BUSINESS DETAILS -->
    <input type="text" name="businessName" placeholder="Business Name *" required>
    <input type="text" name="ownerName" placeholder="Owner Name *" required>

    <!-- CITY INPUT -->
    <input 
      type="text" 
      id="cityInput"
      name="city"
      placeholder="Enter Area / City (e.g., Chattarpur Delhi)*"
      required
    >

    <!-- DETECT LOCATION -->
    <button type="button" id="detectLocation" class="location-btn">
      Detect My Location
    </button>

    <!-- HIDDEN COORDINATES -->
    <input type="hidden" id="vendorLat" name="latitude">
    <input type="hidden" id="vendorLng" name="longitude">

    <!-- NEW HIDDEN LOCALITY FIELDS -->
    <input type="hidden" id="vendorLocality">
    <input type="hidden" id="vendorFullAddress">
    <input type="hidden" id="vendorPlaceId">
    <input type="hidden" id="vendorPincode">

    <!-- CATEGORY -->
    <select name="category" id="mainCategory" required>
      <option value="">Select Main Category *</option>
      <option value="Wedding Services">Wedding Services</option>
      <option value="Banquet / Venue">Banquet / Venue</option>
      <option value="Birthday">Birthday</option>
      <option value="Corporate Events">Corporate Events</option>
      <option value="Catering">Catering</option>
      <option value="Decoration">Decoration</option>
      <option value="Makeup Artists">Makeup Artists</option>
      <option value="Photography">Photography</option>
    </select>

    <!-- SUB CATEGORY -->
    <select name="subcategory" id="subCategory" required>
      <option value="">Select Sub Category *</option>
    </select>

    <!-- PRICING -->
    <input type="number" name="price" placeholder="Starting Price *" required>
    <input type="number" name="perPlate" id="perPlateField" placeholder="Per Plate Price" style="display:none;">

    <!-- SERVICES -->
    <textarea name="services" placeholder="Services Offered (comma separated) *" required></textarea>

    <!-- ABOUT -->
    <textarea name="about" placeholder="About your service *" required></textarea>

    <!-- SERVICE AREA -->
    <input type="text" name="serviceArea" placeholder="Service Areas / Locations (optional)">

    <!-- EXPERIENCE -->
    <input type="number" name="experience" placeholder="Experience (Years)">

    <!-- TEAM SIZE -->
    <input type="number" name="teamSize" placeholder="Team Size">

    <!-- IMAGES -->
    <label>Upload Photos (1–10)</label>
    <input type="file" id="photoUpload" accept="image/*" multiple>
    <div id="previewBox" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;"></div>

    <button type="submit">Submit</button>
  </form>

</div>

<!-- SUBCATEGORY LOGIC -->
<script>
const subMap = {
  "Wedding Services": ["Photographer","Decorator","Wedding Planner","Makeup Artist","Mehndi Artist","Pre-Wedding Shoot","Cinematography","All Services"],
  "Banquet / Venue": ["Indoor Hall","Outdoor Lawn","AC Banquet","Resort Venue","Marriage Garden","Destination Venue","Rooftop Venue","All Services"],
  "Birthday": ["Theme Birthday","Balloon Decor","Kids Magician","Games Host","Tattoo Artist","Birthday Photography","All Services"],
  "Corporate Events": ["Event Planning","Corporate Catering","Conference Setup","Exhibition Setup","Corporate Decor","Corporate Photography","All Services"],
  "Catering": ["Veg Catering","Non-Veg Catering","Wedding Catering","Corporate Catering","Buffet","Live Counters","All Services"],
  "Decoration": ["Wedding Decor","Haldi Decor","Mehndi Decor","Flower Decor","Birthday Decor","Balloon Decor","All Services"],
  "Makeup Artists": ["Bridal Makeup","HD Makeup","Party Makeup","Airbrush Makeup","Engagement Makeup","All Services"],
  "Photography": ["Wedding Photography","Candid Photography","Cinematic Film","Drone Shoots","Pre-Wedding Shoot","Birthday Photography","All Services"]
};

document.getElementById("mainCategory").addEventListener("change", () => {
  const cat = mainCategory.value;
  subCategory.innerHTML = `<option value="">Select Sub Category *</option>`;
  if (subMap[cat]) {
    subMap[cat].forEach(item =>
      subCategory.innerHTML += `<option value="${item}">${item}</option>`
    );
  }
  document.getElementById("perPlateField").style.display = 
    cat === "Banquet / Venue" ? "block" : "none";
});
</script>

<!-- GOOGLE AUTOCOMPLETE + LOCALITY EXTRACTION -->
<script>
let autocomplete;

function initAutocomplete() {
  autocomplete = new google.maps.places.Autocomplete(
    document.getElementById("cityInput"),
    { componentRestrictions: { country: "in" } }
  );

  autocomplete.addListener("place_changed", () => {
    const p = autocomplete.getPlace();
    if (!p.geometry) return;

    document.getElementById("vendorLat").value = p.geometry.location.lat();
    document.getElementById("vendorLng").value = p.geometry.location.lng();

    const comps = p.address_components;

    const locality =
      comps.find(c => c.types.includes("sublocality_level_1"))?.long_name ||
      comps.find(c => c.types.includes("locality"))?.long_name ||
      "";

    const pincode =
      comps.find(c => c.types.includes("postal_code"))?.long_name || "";

    document.getElementById("vendorLocality").value = locality;
    document.getElementById("vendorFullAddress").value = p.formatted_address;
    document.getElementById("vendorPlaceId").value = p.place_id;
    document.getElementById("vendorPincode").value = pincode;
  });
}
google.maps.event.addDomListener(window, "load", initAutocomplete);
</script>

<!-- GPS LOCATION -->
<script>
document.getElementById("detectLocation").onclick = () => {
  if (!navigator.geolocation) return alert("GPS not supported!");

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    document.getElementById("vendorLat").value = lat;
    document.getElementById("vendorLng").value = lng;

    const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=YOUR_API_KEY`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.results.length) return alert("Location not found!");

    const comps = data.results[0].address_components;

    const locality =
      comps.find(c => c.types.includes("sublocality_level_1"))?.long_name ||
      comps.find(c => c.types.includes("locality"))?.long_name ||
      "";

    document.getElementById("cityInput").value = locality;
    document.getElementById("vendorLocality").value = locality;
  });
};
</script>

<!-- VENDOR REGISTER LOGIC -->
<script type="module" src="../scripts/vendor-register.js"></script>

<script src="../scripts/smooth-ui.js"></script>

</body>
</html>
