<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Registration</title>

<!-- MAIN SITE CSS -->
<link rel="stylesheet" href="../styles.css">

<!-- GOOGLE MAPS AUTOCOMPLETE -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>

<style>
.location-btn {
  background:#d4a017;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  margin:6px 0;
  font-weight:600;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1 class="title">Business Details</h1>

<div class="form-box">

  <form id="vendorRegisterForm">

    <!-- BUSINESS DETAILS -->
    <input type="text" name="businessName" placeholder="Business Name *" required>
    <input type="text" name="ownerName" placeholder="Owner Name *" required>

    <!-- CITY AUTOCOMPLETE -->
    <input 
      type="text" 
      id="cityInput"
      name="city"
      placeholder="Enter City *"
      required
    >

    <!-- DETECT MY LOCATION -->
    <button type="button" id="detectLocation" class="location-btn">
      Detect My Location
    </button>

    <!-- HIDDEN COORDINATES -->
    <input type="hidden" id="vendorLat" name="latitude">
    <input type="hidden" id="vendorLng" name="longitude">

    <!-- MAIN CATEGORY DROPDOWN -->
    <select name="category" id="mainCategory" required>
      <option value="">Select Main Category *</option>
      <option value="Wedding Services">Wedding Services</option>
      <option value="Banquet / Venue">Banquet / Venue</option>
      <option value="Birthday">Birthday</option>
      <option value="Corporate Events">Corporate Events</option>
      <option value="Catering">Catering</option>
      <option value="Decoration">Decoration</option>
      <option value="Makeup Artists">Makeup Artists</option>
      <option value="Photography">Photography</option>
    </select>

    <!-- SUB CATEGORY AUTO-FILL -->
    <select name="subcategory" id="subCategory" required>
      <option value="">Select Sub Category *</option>
    </select>

    <!-- PRICE FIELD -->
    <input type="number" name="price" placeholder="Starting Price *" required>

    <!-- PER PLATE ONLY FOR BANQUET -->
    <input type="number" name="perPlate" id="perPlateField" placeholder="Per Plate Price" style="display:none;">

    <!-- SERVICES OFFERED -->
    <textarea name="services" placeholder="Services Offered (comma separated) *" required></textarea>

    <!-- ABOUT -->
    <textarea name="about" placeholder="About your service *" required></textarea>

    <!-- SERVICE AREA -->
    <input type="text" name="serviceArea" placeholder="Service Areas / Locations (optional)">

    <!-- EXPERIENCE -->
    <input type="number" name="experience" placeholder="Experience (Years)">

    <!-- TEAM SIZE -->
    <input type="number" name="teamSize" placeholder="Team Size">

    <!-- CLOUDINARY MULTIPLE IMAGE UPLOAD -->
    <label>Upload Photos (1–10)</label>
    <input type="file" id="photoUpload" accept="image/*" multiple>

    <div id="previewBox" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;"></div>

    <button type="submit">Submit</button>
  </form>

</div>

<!-- ---------------------
     SUBCATEGORY LOGIC
----------------------- -->
<script>
const subMap = {
  "Wedding Services": [
    "Photographer","Decorator","Wedding Planner","Makeup Artist",
    "Mehndi Artist","Pre-Wedding Shoot","Cinematography","All Services"
  ],
  "Banquet / Venue": [
    "Indoor Hall","Outdoor Lawn","AC Banquet","Resort Venue",
    "Marriage Garden","Destination Venue","Rooftop Venue","All Services"
  ],
  "Birthday": [
    "Theme Birthday","Balloon Decor","Kids Magician","Games Host",
    "Tattoo Artist","Birthday Photography","All Services"
  ],
  "Corporate Events": [
    "Event Planning","Corporate Catering","Conference Setup",
    "Exhibition Setup","Corporate Decor","Corporate Photography","All Services"
  ],
  "Catering": [
    "Veg Catering","Non-Veg Catering","Wedding Catering",
    "Corporate Catering","Buffet","Live Counters","All Services"
  ],
  "Decoration": [
    "Wedding Decor","Haldi Decor","Mehndi Decor","Flower Decor",
    "Birthday Decor","Balloon Decor","All Services"
  ],
  "Makeup Artists": [
    "Bridal Makeup","HD Makeup","Party Makeup","Airbrush Makeup",
    "Engagement Makeup","All Services"
  ],
  "Photography": [
    "Wedding Photography","Candid Photography","Cinematic Film",
    "Drone Shoots","Pre-Wedding Shoot","Birthday Photography","All Services"
  ]
};

const mainCat = document.getElementById("mainCategory");
const subCat = document.getElementById("subCategory");
const perPlate = document.getElementById("perPlateField");

mainCat.addEventListener("change", () => {
  const cat = mainCat.value;
  subCat.innerHTML = `<option value="">Select Sub Category *</option>`;

  if (subMap[cat]) {
    subMap[cat].forEach(item => {
      subCat.innerHTML += `<option value="${item}">${item}</option>`;
    });
  }

  perPlate.style.display = cat === "Banquet / Venue" ? "block" : "none";
});
</script>

<!-- ---------------------
     GOOGLE AUTOCOMPLETE
----------------------- -->
<script>
// CITY AUTOCOMPLETE
let autocomplete;

function initAutocomplete() {
  autocomplete = new google.maps.places.Autocomplete(
    document.getElementById("cityInput"),
    { types: ["(cities)"], componentRestrictions: { country: "in" } }
  );

  autocomplete.addListener("place_changed", () => {
    const place = autocomplete.getPlace();
    console.log("City selected:", place.formatted_address);
  });
}
google.maps.event.addDomListener(window, "load", initAutocomplete);
</script>

<!-- ---------------------
     DETECT MY LOCATION
----------------------- -->
<script>
document.getElementById("detectLocation").onclick = () => {
  if (!navigator.geolocation) {
    alert("GPS not supported!");
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    document.getElementById("vendorLat").value = lat;
    document.getElementById("vendorLng").value = lng;

    // REVERSE GEOCODE
    const url =
      `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=YOUR_API_KEY`;

    const res = await fetch(url);
    const data = await res.json();

    const cityRes = data.results.find(r => 
      r.types.includes("locality") || r.types.includes("administrative_area_level_2")
    );

    if (cityRes) {
      document.getElementById("cityInput").value = cityRes.address_components[0].long_name;
    }

    alert("Location detected!");
  });
};
</script>

<!-- VENDOR REGISTER SCRIPT -->
<script type="module" src="../scripts/vendor-register.js"></script>

<script src="../scripts/smooth-ui.js"></script>

</body>
</html>
