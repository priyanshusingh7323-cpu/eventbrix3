<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Registration | EventBrix</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<div class="form-box">
  <h2>Vendor Registration</h2>

  <form id="vendorRegisterForm">

    <input type="text" name="businessName" placeholder="Business Name *" required />

    <input type="text" name="owner" placeholder="Owner Name *" required />

    <input type="text" name="city" placeholder="City *" required />

    <!-- Category -->
    <select name="category" id="mainCategory" required>
      <option value="">Select Category *</option>
      <option value="wedding">Wedding</option>
      <option value="birthday">Birthday</option>
      <option value="corporate">Corporate</option>
      <option value="banquet">Banquet / Venue</option>
      <option value="photo">Photography / Videography</option>
      <option value="catering">Catering</option>
      <option value="decoration">Decoration</option>
      <option value="makeup">Makeup Artist</option>
    </select>

    <!-- Subcategory -->
    <div id="subcategoryBox" style="display:none;">
      <select name="subcategory" id="subCategory">
        <option value="">Select Subcategory *</option>
      </select>
    </div>

    <!-- Price -->
    <input type="number" name="price" placeholder="Starting Price *" required />

    <!-- About -->
    <textarea name="about" placeholder="About your service *" required></textarea>

    <button type="submit">Submit</button>
  </form>
</div>

<!-- VERY IMPORTANT script path -->
<script type="module" src="../../scripts/vendor-register.js"></script>

</body>
</html>
