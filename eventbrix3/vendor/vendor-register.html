<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Registration</title>

<link rel="stylesheet" href="../styles.css">

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>

<style>
.location-btn {
  background:#d4a017;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  margin:6px 0;
  font-weight:600;
  color:white;
  cursor:pointer;
}
.hidden { display:none; }
</style>
</head>

<body>

<h1 class="title">Business Details</h1>

<div class="form-box">

  <form id="vendorRegisterForm">

    <!-- BUSINESS DETAILS -->
    <input type="text" name="businessName" placeholder="Business Name *" required>
    <input type="text" name="ownerName" placeholder="Owner Name *" required>

    <!-- CITY INPUT -->
    <input 
      type="text" 
      id="cityInput"
      name="city"
      placeholder="Enter Area / City (e.g., Chattarpur Delhi)*"
      required
    >

    <button type="button" id="detectLocation" class="location-btn">Detect My Location</button>

    <input type="hidden" id="vendorLat" name="latitude">
    <input type="hidden" id="vendorLng" name="longitude">
    <input type="hidden" id="vendorLocality">
    <input type="hidden" id="vendorFullAddress">
    <input type="hidden" id="vendorPlaceId">
    <input type="hidden" id="vendorPincode">

    <!-- CATEGORY -->
    <select name="category" id="mainCategory" required>
      <option value="">Select Main Category *</option>
      <option value="Wedding Services">Wedding Services</option>
      <option value="Banquet / Venue">Banquet / Venue</option>
      <option value="Birthday">Birthday</option>
      <option value="Corporate Events">Corporate Events</option>
      <option value="Catering">Catering</option>
      <option value="Decoration">Decoration</option>
      <option value="Makeup Artists">Makeup Artists</option>
      <option value="Photography">Photography</option>
    </select>

    <!-- SUBCATEGORY -->
    <select name="subcategory" id="subCategory" required>
      <option value="">Select Sub Category *</option>
    </select>

    <!-- PRICING -->
    <input type="number" name="price" placeholder="Starting Price *" required>
    <input type="number" name="perPlate" id="perPlateField" placeholder="Per Plate Price" style="display:none;">

    <!-- SERVICES -->
    <textarea name="services" placeholder="Services Offered (comma separated) *" required></textarea>

    <!-- ABOUT -->
    <textarea name="about" placeholder="About your service *" required></textarea>

    <!-- SERVICE AREA -->
    <input type="text" name="serviceArea" placeholder="Service Areas / Locations (optional)">

    <!-- EXPERIENCE -->
    <input type="number" name="experience" placeholder="Experience (Years)">

    <!-- TEAM SIZE -->
    <input type="number" name="teamSize" placeholder="Team Size">

    <!-- PAYMENT LOGIC YOU REQUESTED -->
    <h3 style="margin-top:15px;">How will you collect payment?</h3>

    <select id="paymentMethod" name="paymentMethod" required>
      <option value="">Select Option *</option>
      <option value="full">Full Payment Before Event</option>
      <option value="advance">Advance + Remaining Amount</option>
    </select>

    <div id="advanceBox" class="hidden">
      <h4>Select Advance %</h4>
      <select id="advancePercent" name="advancePercent">
        <option value="">Choose Advance % *</option>
        <option value="20">20% Advance</option>
        <option value="30">30% Advance</option>
        <option value="40">40% Advance</option>
        <option value="50">50% Advance</option>
      </select>
    </div>

    <!-- KYC PLACEHOLDER -->
    <div style="padding:10px;margin-top:20px;border:1px dashed #555;border-radius:10px;">
      <h3>Verification (Coming Soon)</h3>
      <p style="color:gray;">We will ask for KYC documents after your listing is approved.</p>
    </div>

    <!-- IMAGES -->
    <label>Upload Photos (1–10)</label>
    <input type="file" id="photoUpload" accept="image/*" multiple>
    <div id="previewBox" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;"></div>

    <button type="submit">Submit</button>
  </form>

</div>

<script src="../scripts/smooth-ui.js"></script>
<script type="module" src="../scripts/vendor-register.js"></script>

</body>
</html>
