<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Registration</title>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<h1 class="title">Business Details</h1>

<div class="form-box">

  <form id="vendorRegisterForm">

    <!-- BUSINESS DETAILS -->
    <input type="text" name="businessName" placeholder="Business Name *" required>
    <input type="text" name="ownerName" placeholder="Owner Name *" required>
    <input type="text" name="city" placeholder="City *" required>

    <!-- MAIN CATEGORY DROPDOWN -->
    <select name="category" id="mainCategory" required>
      <option value="">Select Main Category *</option>
      <option value="Wedding Services">Wedding Services</option>
      <option value="Banquet / Venue">Banquet / Venue</option>
      <option value="Birthday">Birthday</option>
      <option value="Corporate Events">Corporate Events</option>
      <option value="Catering">Catering</option>
      <option value="Decoration">Decoration</option>
      <option value="Makeup Artists">Makeup Artists</option>
      <option value="Photography">Photography</option>
    </select>

    <!-- SUB CATEGORY AUTO-FILL -->
    <select name="subcategory" id="subCategory" required>
      <option value="">Select Sub Category *</option>
    </select>

    <!-- PRICE FIELD -->
    <input type="number" name="price" placeholder="Starting Price *" required>

    <!-- PER PLATE ONLY FOR BANQUET -->
    <input type="number" name="perPlate" id="perPlateField" placeholder="Per Plate Price" style="display:none;">

    <!-- SERVICES OFFERED -->
    <textarea name="services" placeholder="Services Offered (comma separated) *" required></textarea>

    <!-- ABOUT -->
    <textarea name="about" placeholder="About your service *" required></textarea>

    <!-- VENUE / LOCATION -->
    <input type="text" name="serviceArea" placeholder="Service Areas / Locations (optional)">

    <!-- EXPERIENCE -->
    <input type="number" name="experience" placeholder="Experience (Years)">

    <!-- TEAM SIZE -->
    <input type="number" name="teamSize" placeholder="Team Size">

    <!-- CLOUDINARY MULTIPLE IMAGE UPLOAD -->
    <label>Upload Photos (1–10)</label>
    <input type="file" id="photoUpload" accept="image/*" multiple>

    <div id="previewBox" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;"></div>

    <button type="submit">Submit</button>
  </form>

</div>

<!-- VENDOR REGISTER SCRIPT -->
<script type="module" src="../scripts/vendor-register.js"></script>

<script>
// -------------------------
// AUTO SUBCATEGORY SYSTEM (FINAL FIXED)
// -------------------------

const subMap = {
  "Wedding Services": [
    "Photographer",
    "Decorator",
    "Wedding Planner",
    "Makeup Artist",
    "Mehndi Artist",
    "Pre-Wedding Shoot",
    "Cinematography",
    "All Services"
  ],

  "Banquet / Venue": [
    "Indoor Hall",
    "Outdoor Lawn",
    "AC Banquet",
    "Resort Venue",
    "Marriage Garden",
    "Destination Venue",
    "Rooftop Venue",
    "All Services"
  ],

  "Birthday": [
    "Theme Birthday",
    "Balloon Decor",
    "Kids Magician",
    "Games Host",
    "Tattoo Artist",
    "Birthday Photography",
    "All Services"
  ],

  "Corporate Events": [
    "Event Planning",
    "Corporate Catering",
    "Conference Setup",
    "Exhibition Setup",
    "Corporate Decor",
    "Corporate Photography",
    "All Services"
  ],

  "Catering": [
    "Veg Catering",
    "Non-Veg Catering",
    "Wedding Catering",
    "Corporate Catering",
    "Buffet",
    "Live Counters",
    "All Services"
  ],

  "Decoration": [
    "Wedding Decor",
    "Haldi Decor",
    "Mehndi Decor",
    "Flower Decor",
    "Birthday Decor",
    "Balloon Decor",
    "All Services"
  ],

  "Makeup Artists": [
    "Bridal Makeup",
    "HD Makeup",
    "Party Makeup",
    "Airbrush Makeup",
    "Engagement Makeup",
    "All Services"
  ],

  "Photography": [
    "Wedding Photography",
    "Candid Photography",
    "Cinematic Film",
    "Drone Shoots",
    "Pre-Wedding Shoot",
    "Birthday Photography",
    "All Services"
  ]
};

const mainCat = document.getElementById("mainCategory");
const subCat = document.getElementById("subCategory");
const perPlate = document.getElementById("perPlateField");

mainCat.addEventListener("change", () => {
  const cat = mainCat.value;

  // Reset subcategory
  subCat.innerHTML = `<option value="">Select Sub Category *</option>`;

  // Fill new subcategories
  if (subMap[cat]) {
    subMap[cat].forEach(item => {
      subCat.innerHTML += `<option value="${item}">${item}</option>`;
    });
  }

  // Per Plate logic: only for banquet
  perPlate.style.display =
    cat === "Banquet / Venue" ? "block" : "none";
});
</script>

</body>
</html>
