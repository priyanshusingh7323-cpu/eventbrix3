<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Profile | EventBrix</title>
<link rel="stylesheet" href="../styles.css">
</head>

<body>

<h1 class="title">Vendor Profile</h1>

<img id="headerImg" class="profile-header" src="/images/default.jpg">

<div class="vendor-info">
  <h2 id="vendorName"></h2>

  <p><strong>Category:</strong> <span id="vendorCategory"></span></p>
  <p><strong>City:</strong> <span id="vendorCity"></span></p>
  <p><strong>Starting Price:</strong> <span id="vendorPrice"></span></p>

  <div class="action-buttons">
    <a id="chatBtn">Chat</a>
    <button id="saveVendorBtn">❤️ Save</button>
  </div>

  <h3>About</h3>
  <p id="vendorAbout"></p>

  <h3 style="margin-top:20px;">Listings</h3>
  <div id="vendorListings"></div>
</div>

<script type="module" src="../scripts/vendor-profile.js"></script>
</body>
</html>
