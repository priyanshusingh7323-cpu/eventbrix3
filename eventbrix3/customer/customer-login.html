<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login | EventBrix</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="form-box">
    <h2>Customer Login</h2>

    <form id="customerLoginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="customer-register.html">Register</a></p>

    <!-- 🔥 GOOGLE SIGN-IN BUTTON -->
    <button id="googleLoginBtn" class="google-btn" style="
      width:100%;
      padding:12px;
      margin-top:15px;
      background:white;
      border:none;
      border-radius:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      cursor:pointer;
      font-weight:600;
    ">
      <img src="../images/google.png" style="width:22px;">
      Continue with Google
    </button>
  </div>

  <!-- 🔥 ADD THESE TWO SCRIPTS -->
  <script type="module" src="../scripts/firebase.js"></script>
  <script type="module" src="../scripts/auth-google.js"></script>

  <!-- existing login logic -->
  <script type="module" src="../scripts/customer-login.js"></script>
</body>
</html>
