<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login | EventBrix</title>
<link rel="stylesheet" href="../styles.css" />
</head>

<body>

<h1 class="title">Customer Login</h1>

<div class="form-box">

  <button id="otpLoginBtn" style="
      margin-top:12px;width:100%;padding:12px;
      background:#d4a017;border-radius:10px;
      font-weight:600;cursor:pointer;">
    Login with Phone (OTP)
  </button>

  <div id="otpLoginBox" style="display:none;margin-top:10px;">
    <input type="text" id="otpLoginInput" placeholder="Enter OTP *" />
    <button id="verifyOtpLoginBtn">Verify OTP</button>
  </div>

  <div id="recaptcha-login-container"></div>

  <!-- GOOGLE LOGIN -->
  <button id="googleLoginBtn" style="
      margin-top:12px;width:100%;padding:12px;
      background:white;color:black;border-radius:10px;
      font-weight:600;cursor:pointer;">
    Login with Google
  </button>

  <p style="text-align:center;margin-top:10px;">
    Not a member?
    <a href="customer-register.html" style="color:#d4a017;">Sign Up</a>
  </p>

</div>

<!-- IMPORTANT: external JS load -->
<script type="module" src="../scripts/customer-login.js"></script>

<script src="../scripts/smooth-ui.js"></script>

</body>
</html>
