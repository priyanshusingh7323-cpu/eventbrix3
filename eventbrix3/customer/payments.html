<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payments & Refunds | EventBrix</title>

<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/styles-dashboard.css" />

<style>
  body { background:#0b0b0b; color:#fff; }

  .payment-card {
    background:#111;
    padding:18px;
    border:1px solid rgba(255,200,50,0.3);
    margin:15px;
    border-radius:12px;
  }
  .payment-card h3 { color:gold; }

  .pay-btn {
    width:100%;
    padding:12px;
    background:gold;
    color:black;
    border:none;
    border-radius:10px;
    margin-top:12px;
    font-weight:bold;
    cursor:pointer;
  }

  .secondary-btn {
    width:100%;
    padding:12px;
    background:#222;
    color:gold;
    border:1px solid gold;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
  }

  .expired { color:red; font-weight:bold; }
  .active { color:#5cb85c; font-weight:bold; }
</style>

</head>

<body>

<h2 style="text-align:center;color:gold;margin-top:20px;">
  Payments & Refunds
</h2>

<div id="paymentList"></div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module" src="/scripts/payment-page.js"></script>

</body>
</html>
