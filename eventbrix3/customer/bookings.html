<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | EventBrix</title>

<!-- GLOBAL + DASHBOARD THEME -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/styles-dashboard.css">

<style>
.page-header {
  background:#111;
  padding:15px;
  color:gold;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  border-bottom:1px solid rgba(255,200,60,0.2);
}

.booking-card {
  background:#161616;
  border:1px solid rgba(255,200,60,0.25);
  padding:15px;
  margin:12px;
  border-radius:14px;
  color:white;
}

.pay-btn {
  width:100%;
  margin-top:12px;
  padding:12px;
  background:gold;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.later-btn {
  width:100%;
  margin-top:10px;
  padding:12px;
  background:#222;
  border:1px solid gold;
  color:gold;
  border-radius:10px;
  cursor:pointer;
}

.status-box {
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="page-header">My Bookings</div>

<!-- BOOKINGS RENDER HERE -->
<div id="myBookings"></div>

<!-- Connect mybookings.js -->
<script type="module" src="/scripts/mybookings.js"></script>

</body>
</html>
