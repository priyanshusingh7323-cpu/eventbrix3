<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Registration | EventBrix</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="form-box">
    <h2>Create Customer Account</h2>

    <form id="customerRegisterForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>

    <button id="googleSignupBtn" class="google-btn" style="
      width:100%; padding:12px; margin-top:15px;
      background:white; border:none; border-radius:10px;
      display:flex; justify-content:center; align-items:center;
      gap:10px; cursor:pointer; font-weight:600;">
      <img src="../images/google.png" style="width:22px;">
      Sign Up with Google
    </button>

    <p>Already have an account? <a href="customer-login.html">Login</a></p>
  </div>

  <script type="module" src="../scripts/firebase.js"></script>
  <script type="module" src="../scripts/auth-google.js"></script>
  <script type="module" src="../scripts/customer-register.js"></script>
</body>
</html>
