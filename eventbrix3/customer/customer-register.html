<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account | EventBrix</title>
<link rel="stylesheet" href="../styles.css" />
</head>

<body>
<h1 class="title">Create Account</h1>

<div class="form-box">

  <!-- SIGNUP FORM -->
  <form id="customerRegisterForm">
    <input type="text" id="name" placeholder="Full Name *" required />
    <input type="email" id="email" placeholder="Email *" required />
    <input type="text" id="phone" placeholder="Phone *" required />
    <input type="text" id="city" placeholder="City *" required />
    <button type="submit">Register</button>
  </form>

  <!-- OTP SIGNUP -->
  <button id="otpSignupBtn" style="margin-top:12px;width:100%;padding:12px;
      background:#d4a017;border-radius:10px;font-weight:600;cursor:pointer;">
    Sign Up with Phone (OTP)
  </button>

  <div id="otpBox" style="display:none;margin-top:10px;">
    <input type="text" id="otpInput" placeholder="Enter OTP *" />
    <button id="verifyOtpBtn">Verify OTP</button>
  </div>

  <!-- REQUIRED FOR OTP -->
  <div id="recaptcha-container"></div>

  <!-- GOOGLE SIGNUP -->
  <button id="googleRegisterBtn" style="margin-top:12px;width:100%;padding:12px;
      background:white;color:black;border-radius:10px;font-weight:600;cursor:pointer;">
    Sign Up with Google
  </button>

  <!-- APPLE SIGNUP -->
  <button id="appleRegisterBtn" style="margin-top:12px;width:100%;padding:12px;
      background:black;color:white;border-radius:10px;font-weight:600;cursor:pointer;">
    Sign Up with Apple
  </button>

  <p style="text-align:center;margin-top:10px;">
    Already a member?
    <a href="customer-login.html" style="color:#d4a017;">Login</a>
  </p>
</div>

<!-- ⭐ VERY IMPORTANT: LINK EXTERNAL JS -->
<script type="module" src="../scripts/customer-register.js"></script>
<script src="../scripts/smooth-ui.js"></script>

</body>
</html>
