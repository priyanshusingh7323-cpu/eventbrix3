<!DOCTYPE html>
<html>
<head>
  <title>Wedding Vendors | EventBrix</title>

  <!-- MAIN SITE CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- ADVANCED VENDOR CARD CSS -->
  <link rel="stylesheet" href="vendor/vendor-card.css" />

  <style>
    .distance-chip {
      background:#ffd24a;
      color:#000;
      padding:3px 8px;
      font-size:12px;
      border-radius:8px;
      font-weight:600;
      margin-left:6px;
    }
  </style>
</head>

<body>

  <h2 class="cat-title">Wedding Vendors</h2>

  <!-- FILTERS -->
  <div style="
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
  ">

    <select id="cityFilter" style="
      padding:10px; border-radius:8px;
      background:#111; color:white;
      border:1px solid #444; min-width:160px;
    ">
      <option value="">All Cities</option>
      <option value="delhi">Delhi</option>
      <option value="mumbai">Mumbai</option>
      <option value="jaipur">Jaipur</option>
      <option value="lucknow">Lucknow</option>
      <option value="kolkata">Kolkata</option>
    </select>

    <input id="searchBar"
      placeholder="Search Vendors..."
      style="
        padding:10px; border-radius:8px;
        background:#111; color:white;
        border:1px solid #444; min-width:220px;
      " />

    <select id="sortFilter" style="
      padding:10px; border-radius:8px;
      background:#111; color:white;
      border:1px solid #444; min-width:160px;
    ">
      <option value="">Sort By</option>
      <option value="low">Price: Low → High</option>
      <option value="high">Price: High → Low</option>
    </select>

  </div>

  <button id="detectLocationBtn" style="
    background:#ffd24a;
    color:#000;
    padding:10px 15px;
    border-radius:10px;
    border:none;
    font-weight:700;
    display:block;
    margin:0 auto 15px auto;
    cursor:pointer;
  ">
    🔍 Detect My Location
  </button>

  <!-- VENDOR LIST -->
  <div id="vendorList" class="vendor-grid"></div>

  <!-- FIREBASE -->
  <script type="module" src="scripts/firebase.js"></script>

  <!-- PAGE LOGIC -->
  <script type="module" src="scripts/category-wedding.js"></script>
  <script src="scripts/smooth-ui.js"></script>
</body>
</html>
